<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Pengiriman — SITTA UT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="halaman-dalam">

  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="dashboard.html">SITTA UT</a>
      <nav class="menu-nav">
        <a href="dashboard.html">Beranda</a>
        <a href="stok.html">Informasi Bahan Ajar</a>
        <a href="tracking.html" class="aktif">Tracking Pengiriman</a>
        <a href="laporan.html">Laporan</a>
        <a href="histori.html">Histori Transaksi</a>
      </nav>
      <div class="user-info">
        <button class="btn btn-kecil" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section>
      <p id="greeting"></p>
      <h1>Tracking Pengiriman</h1>
      <p>Masukkan nomor delivery order untuk melihat status pengiriman bahan ajar Anda.</p>
      <p><small>Contoh nomor DO: <code>2023001234</code> atau <code>2023005678</code></small></p>
    </section>

    <!-- bagian form untuk memasukkan nomor delivery order yang mau dicari -->
    <section class="card">
      <form id="formCari" class="form-cari">
        <label for="nomorDO">Nomor Delivery Order</label>
        <input type="text" id="nomorDO" name="nomorDO" placeholder="contoh: 2023001234">
        <button type="submit" class="btn">Cari</button>
      </form>
    </section>

    <!-- bagian hasil pencarian, isinya dimunculkan lewat js/tracking.js -->
    <section id="hasilTracking"></section>
  </main>

  <footer class="footer">
    <p>SITTA — Universitas Terbuka</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tracking.js"></script>
</body>
</html>
